<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Platformum</title>
    <style>
        body { background-color: #121212; color: white; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #ff4757; }
        .video-card { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    </style>
</head>
<body>

    <h1>Kendi Video Sitem</h1>

    <div class="video-card">
        <h3>Örnek Video</h3>
        <div class="video-container">
            <!-- Buraya harici video sitelerinden aldığınız embed kodunu yapıştırabilirsiniz -->
            <iframe src="https://example.com" allowfullscreen></iframe>
        </div>
    </div>

</body>
</html>
