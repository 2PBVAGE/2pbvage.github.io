<!DOCTYPE html>
<html lang="tr">
<head>

    <!-- Modern Montserrat Fontu -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ÜST BAR (SİYAH) */
        .header-bar {
            width: 100%;
            max-width: 600px;
            background-color: #000000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            border-bottom: 1px solid #222222;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-icon {
            font-size: 20px;
            color: #ffffff;
            cursor: pointer;
        }
        .header-logo {
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        /* İÇERİK KAPSAYICI */
        .content-container {
            width: 100%;
            max-width: 600px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 1. ÜSTTE VİDEO BAŞLIĞI */
        .video-title {
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            line-height: 1.35;
            margin-top: 5px;
        }

        /* 2. SİTE İÇİ VİDEO OYNATICI (SİYAH ÇERÇEVE) */
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Oranı */
            background-color: #000000;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.9);
        }

        /* İLK BAŞTA GÖRÜNEN KAPAK VE OYNAT BUTONU */
        .video-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://leakgrl.com/storage/thumbs/5HajB5frpfR8iIlMx1LazHoK-640w.webp');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }

        .play-button {
            width: 65px;
            height: 65px;
            background: rgba(255, 71, 87, 0.95);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.6);
        }

        .play-button::after {
            content: "";
            border-style: solid;
            border-width: 12px 0 12px 22px;
            border-color: transparent transparent transparent #ffffff;
            margin-left: 5px;
        }

        /* SİTEYE GÖMÜLÜ OYNATICI (IFRAME) */
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            z-index: 5;
        }
    </style>
</head>
<body>

    <!-- ÜST MENÜ BARİ -->
    <div class="header-bar">
        <div class="header-icon">☰</div>
        <a href="#" class="header-logo">2PBVAGE 🤍</a>
        <div class="header-icon">🔍</div>
    </div>

    <!-- İÇERİK ALANI -->
    <div class="content-container">

        <!-- VİDEO BAŞLIĞI (EN ÜSTTE) -->
        <h1 class="video-title">Sophie Rain - Black Panties Strip Video</h1>

        <!-- SİYAH VİDEO OYNATICI (SİTE DIŞINA GİTMEDEN BULDİĞİNİZ YERDE OYNATIR) -->
        <div class="video-wrapper">
            <div id="cover-layer" class="video-cover" onclick="startVideo()">
                <div class="play-button"></div>
            </div>
            <iframe id="video-iframe" src="" allowfullscreen></iframe>
        </div>

    </div>

    <script>
        function startVideo() {
            // Kapak fotoğrafını kaldırır ve videoyu kendi sitenizin içinde doğrudan başlatır
            document.getElementById('cover-layer').style.display = 'none';
            document.getElementById('video-iframe').src = 'https://playmogo.com/e/1fvov3xdwsbq';
        }
    </script>

</body>
</html>
