<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2PBVAGE 🤍 - İzle</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #121212; color: #ffffff; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; }
        .header-bar { width: 100%; max-width: 600px; background-color: #000; display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; border-bottom: 1px solid #222; }
        .header-logo { font-family: 'Montserrat', sans-serif; color: #fff; font-size: 20px; font-weight: 800; text-decoration: none; }
        .content-container { width: 100%; max-width: 600px; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .back-btn { align-self: flex-start; background-color: #222; color: #ff4757; padding: 8px 14px; border-radius: 6px; border: 1px solid #333; text-decoration: none; font-weight: bold; font-size: 12px; }
        
        .video-player-box { position: relative; width: 100%; padding-bottom: 56.25%; background-color: #000; border-radius: 8px; overflow: hidden; border: 1px solid #222; }
        .video-player-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        
        .video-title { font-size: 18px; font-weight: bold; color: #fff; line-height: 1.35; }
        .channel-card { background-color: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: inherit; }
        .channel-info-left { display: flex; align-items: center; gap: 12px; }
        .channel-avatar { width: 45px; height: 45px; border-radius: 50%; background-size: cover; background-position: center; border: 2px solid #ff4757; }
        .channel-btn { background-color: #ff4757; color: #fff; border: none; padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        
        .desc-box { background-color: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; padding: 15px; }
        .desc-heading { font-size: 14px; font-weight: bold; color: #ff4757; margin-bottom: 8px; }
        .desc-text { font-size: 13px; color: #ccc; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="header-bar">
        <a href="index.html" class="header-logo">2PBVAGE 🤍</a>
    </div>

    <div class="content-container">
        <a href="index.html" class="back-btn">⬅ Ana Sayfaya Dön</a>
        
        <h1 id="v-title" class="video-title"></h1>

        <div class="video-player-box">
            <iframe id="v-iframe" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
        </div>

        <div class="channel-card">
            <div class="channel-info-left">
                <div id="v-avatar" class="channel-avatar"></div>
                <div>
                    <div id="v-author" style="font-weight: bold; font-size: 14px;"></div>
                    <div style="font-size: 11px; color: #aaa;">Kanalı & Tüm Videoları Gör</div>
                </div>
            </div>
            <a href="index.html" class="channel-btn" style="text-decoration:none;">Kanala Git</a>
        </div>

        <div class="desc-box">
            <div class="desc-heading">📌 Video Özeti & Detaylar</div>
            <div id="v-desc" class="desc-text"></div>
        </div>
    </div>

    <script>
        var videos = {
            'v1': {
                title: "Sophie Rain Siyah İç Çamaşırıyla Üstsüz Şov Yapıyor",
                url: "https://playmogo.com/e/1fvov3xdwsbq",
                author: "Sophie Rain",
                avatar: "https://i.ibb.co/DPFjgyL/image.png",
                desc: "Sophie Rain, bu özel çekimde kameralar karşısına tamamen cesur bir şekilde geçiyor. Üstsüz bir şekilde göğüslerini öne çıkaran hareketleriyle sınırları zorlayan Sophie Rain'in en çok konuşulan özel anları."
            },
            'v2': {
                title: "Arkadaşım markete giderken ben ve arkadaşımın kız arkadaşı yalnız kaldık...",
                url: "https://playmogo.com/e/ehhg2pcksir6",
                author: "Komotaze",
                avatar: "https://i.ibb.co/pB3ntgg/image.png",
                desc: "Arkadaşının kısa süreliğine markete gitmesini fırsat bilen ikilinin evde baş başa kaldığı tutkulu ve heyecan dolu gizli anlar."
            }
        };

        var urlParams = new URLSearchParams(window.location.search);
        var videoId = urlParams.get('v');

        if (videos[videoId]) {
            var item = videos[videoId];
            document.getElementById('v-title').innerText = item.title;
            document.getElementById('v-author').innerText = item.author;
            document.getElementById('v-avatar').style.backgroundImage = "url('" + item.avatar + "')";
            document.getElementById('v-desc').innerText = item.desc;
            
            // Video oynatıcısını güvenli ve ertelemeli olarak yükle
            setTimeout(function() {
                document.getElementById('v-iframe').src = item.url;
            }, 100);
        } else {
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
