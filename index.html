<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2pbvage - Video Platformu</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f0f0f;
            color: #ffffff;
            padding-bottom: 60px;
        }

        /* Navbar Header */
        header {
            position: sticky;
            top: 0;
            background-color: #0f0f0f;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #272727;
            z-index: 1000;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #ff0000;
            text-decoration: none;
        }

        .nav-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* Garantili Tıklanabilir Buton Stilleri */
        .btn {
            background-color: #272727;
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            touch-action: manipulation;
            position: relative;
            z-index: 10;
        }

        .btn:active {
            opacity: 0.7;
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: #cc0000;
            color: white;
        }

        /* Arama Kutusu */
        .search-container {
            padding: 12px 16px;
            background-color: #0f0f0f;
        }

        .search-box {
            width: 100%;
            padding: 12px 16px;
            background-color: #121212;
            border: 1px solid #303030;
            border-radius: 22px;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .search-box:focus {
            border-color: #ff0000;
        }

        /* Video Listesi Grid */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            padding: 16px;
        }

        .video-card {
            background-color: #181818;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .thumbnail-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background-color: #202020;
        }

        .thumbnail-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-info {
            padding: 12px;
        }

        .video-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 6px;
            line-height: 1.3;
            color: #fff;
        }

        .video-meta {
            font-size: 13px;
            color: #aaa;
        }

        /* Modal Player (Video Oynatıcı) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            flex-direction: column;
        }

        .modal.active {
            display: flex;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background-color: #0f0f0f;
        }

        .player-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            padding-top: 56.25%;
        }

        .player-container iframe, 
        .player-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .player-details {
            padding: 16px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        .action-bar {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }

        /* Yan Menü (Sidebar) */
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background-color: #0f0f0f;
            z-index: 3000;
            transition: left 0.25s ease;
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
        }

        .sidebar.open {
            left: 0;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            z-index: 2500;
        }

        .overlay.active {
            display: block;
        }

        .menu-item {
            display: block;
            padding: 14px 0;
            color: #fff;
            text-decoration: none;
            border-bottom: 1px solid #222;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div style="display: flex; align-items: center; gap: 12px;">
            <button class="btn" id="btn-menu">☰</button>
            <a href="#" class="logo">2pbvage</a>
        </div>
        <div class="nav-actions">
            <button class="btn btn-primary" id="btn-login">Giriş Yap</button>
        </div>
    </header>

    <!-- Side Navigation Menu -->
    <div class="overlay" id="overlay"></div>
    <div class="sidebar" id="sidebar">
        <h2 style="margin-bottom: 20px; color: #ff0000;">2pbvage</h2>
        <a href="#" class="menu-item" id="nav-home">Ana Sayfa</a>
        <a href="#" class="menu-item" id="nav-popular">Popüler</a>
        <a href="#" class="menu-item" id="nav-about">Hakkında</a>
        <button class="btn" id="btn-close-menu" style="margin-top: 20px; width: 100%;">Kapat</button>
    </div>

    <!-- Search Area -->
    <div class="search-container">
        <input type="text" class="search-box" id="search-input" placeholder="Video ara...">
    </div>

    <!-- Main Video Grid -->
    <main class="video-grid" id="video-grid">
        <!-- Videolar JavaScript ile yüklenecek -->
    </main>

    <!-- Video Modal Player -->
    <div class="modal" id="video-modal">
        <div class="modal-header">
            <span style="font-weight: bold;" id="modal-title">Video Başlığı</span>
            <button class="btn" id="btn-close-modal">✕ Kapat</button>
        </div>
        <div class="player-container">
            <iframe id="video-iframe" src="" allowfullscreen></iframe>
        </div>
        <div class="player-details">
            <h3 id="player-video-title" style="margin-bottom: 8px;"></h3>
            <p id="player-video-meta" style="color: #aaa; font-size: 14px;"></p>
            <div class="action-bar">
                <button class="btn" id="btn-like">👍 <span id="like-count">0</span></button>
                <button class="btn" id="btn-subscribe">Abone Ol</button>
            </div>
        </div>
    </div>

    <script>
        // Örnek Veritabanı
        const db = [
            {
                id: "1",
                title: "Harika Doğa Manzaraları 4K",
                author: "Doğa Kanalı",
                views: "125 B",
                likes: 1240,
                embedUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ",
                thumb: "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=500&auto=format&fit=crop"
            },
            {
                id: "2",
                title: "JavaScript ile Web Geliştirme Dersleri",
                author: "Yazılım Kulübü",
                views: "45 B",
                likes: 850,
                embedUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ",
                thumb: "https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=500&auto=format&fit=crop"
            },
            {
                id: "3",
                title: "Mobil Cihazlar İçin UI Tasarım İpuçları",
                author: "Tasarım Vadisi",
                views: "89 B",
                likes: 2100,
                embedUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ",
                thumb: "https://images.unsplash.com/photo-1512941937669-90a1b58e7e9c?w=500&auto=format&fit=crop"
            }
        ];

        // Mobil ve Masaüstü Uyumlu Event Ekleme Fonksiyonu
        function addFastClick(element, handler) {
            if (!element) return;
            let touched = false;

            element.addEventListener('touchend', function (e) {
                touched = true;
                e.preventDefault();
                handler(e);
            }, { passive: false });

            element.addEventListener('click', function (e) {
                if (!touched) {
                    handler(e);
                }
                touched = false;
            });
        }

        // DOM Elemanları
        const videoGrid = document.getElementById('video-grid');
        const searchInput = document.getElementById('search-input');
        const btnMenu = document.getElementById('btn-menu');
        const btnCloseMenu = document.getElementById('btn-close-menu');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const btnLogin = document.getElementById('btn-login');
        const videoModal = document.getElementById('video-modal');
        const btnCloseModal = document.getElementById('btn-close-modal');
        const videoIframe = document.getElementById('video-iframe');
        const modalTitle = document.getElementById('modal-title');
        const playerVideoTitle = document.getElementById('player-video-title');
        const playerVideoMeta = document.getElementById('player-video-meta');
        const btnLike = document.getElementById('btn-like');
        const likeCount = document.getElementById('like-count');
        const btnSubscribe = document.getElementById('btn-subscribe');

        let currentLikes = 0;
        let isSubscribed = false;

        // Videoları Ekrana Basma
        function renderVideos(videos) {
            videoGrid.innerHTML = '';
            videos.forEach(video => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <div class="thumbnail-container">
                        <img src="${video.thumb}" alt="${video.title}">
                    </div>
                    <div class="video-info">
                        <div class="video-title">${video.title}</div>
                        <div class="video-meta">${video.author} • ${video.views} izlenme</div>
                    </div>
                `;
                addFastClick(card, () => openVideo(video));
                videoGrid.appendChild(card);
            });
        }

        // Video Açma Modal
        function openVideo(video) {
            videoIframe.src = video.embedUrl + "?autoplay=1";
            modalTitle.textContent = video.title;
            playerVideoTitle.textContent = video.title;
            playerVideoMeta.textContent = `${video.author} • ${video.views} izlenme`;
            currentLikes = video.likes;
            likeCount.textContent = currentLikes;
            videoModal.classList.add('active');
        }

        // Video Kapatma Modal
        function closeVideo() {
            videoIframe.src = '';
            videoModal.classList.remove('active');
        }

        // Menü Aç/Kapat
        function toggleSidebar(show) {
            if (show) {
                sidebar.classList.add('open');
                overlay.classList.add('active');
            } else {
                sidebar.classList.remove('open');
                overlay.classList.remove('active');
            }
        }

        // Event Listener Bağlamaları (Tıklama Garantili)
        addFastClick(btnMenu, () => toggleSidebar(true));
        addFastClick(btnCloseMenu, () => toggleSidebar(false));
        addFastClick(overlay, () => toggleSidebar(false));
        addFastClick(btnCloseModal, closeVideo);

        addFastClick(btnLogin, () => {
            alert('Giriş Yap butonuna tıklandı!');
        });

        addFastClick(btnLike, () => {
            currentLikes++;
            likeCount.textContent = currentLikes;
        });

        addFastClick(btnSubscribe, () => {
            isSubscribed = !isSubscribed;
            btnSubscribe.textContent = isSubscribed ? 'Abone Olundu' : 'Abone Ol';
            btnSubscribe.style.backgroundColor = isSubscribed ? '#333' : '#cc0000';
        });

        // Arama Dinleyicisi
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = db.filter(v => v.title.toLowerCase().includes(query) || v.author.toLowerCase().includes(query));
            renderVideos(filtered);
        });

        // İlk Yükleme
        renderVideos(db);
    </script>
</body>
</html>
