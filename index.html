<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2PBVAGE 🤍</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent; 
            touch-action: manipulation;
        }
        body { 
            background-color: #121212; 
            color: #ffffff; 
            font-family: Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        
        .header-bar { 
            width: 100%; 
            max-width: 600px; 
            background-color: #000; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 12px 18px; 
            border-bottom: 1px solid #222; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
        }
        .header-logo { 
            font-family: 'Montserrat', sans-serif; 
            color: #fff; 
            font-size: 20px; 
            font-weight: 800; 
            text-decoration: none; 
            cursor: pointer; 
        }
        
        /* KATEGORİ MENÜSÜ (SIDEBAR/DRAWER) */
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 200;
            display: none;
        }
        .menu-drawer {
            position: fixed;
            top: 0;
            left: -280px;
            width: 260px;
            height: 100%;
            background-color: #1a1a1a;
            z-index: 201;
            transition: left 0.3s ease;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #2a2a2a;
        }
        .menu-drawer.open {
            left: 0;
        }
        .menu-header {
            padding: 18px;
            background-color: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
        }
        .menu-title {
            font-size: 16px;
            font-weight: bold;
            color: #ff4757;
        }
        .menu-close {
            font-size: 20px;
            cursor: pointer;
            color: #aaa;
        }
        .category-list {
            list-style: none;
            padding: 15px 0;
        }
        .category-item {
            padding: 14px 20px;
            font-size: 14px;
            color: #ddd;
            cursor: pointer;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .category-item:hover, .category-item.active {
            background-color: #262626;
            color: #ff4757;
            font-weight: bold;
        }

        .content-container { 
            width: 100%; 
            max-width: 600px; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }

        .page-sec { 
            display: none; 
            width: 100%; 
            flex-direction: column; 
            gap: 15px; 
        }
        .active-sec { 
            display: flex !important; 
        }

        .category-heading {
            font-size: 15px;
            font-weight: bold;
            color: #ff4757;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .video-post { 
            background-color: #1e1e1e; 
            border-radius: 12px; 
            overflow: hidden; 
            border: 1px solid #222; 
            margin-bottom: 15px; 
            position: relative; 
        }
        .video-thumbnail { 
            position: relative; 
            width: 100%; 
            padding-bottom: 56.25%; 
            background-size: cover; 
            background-position: center; 
            display: block; 
            cursor: pointer; 
            background-color: #000;
        }
        .play-button { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            width: 55px; 
            height: 55px; 
            background: rgba(255, 71, 87, 0.9); 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            pointer-events: none; 
        }
        .play-button::after { 
            content: ""; 
            border-style: solid; 
            border-width: 10px 0 10px 18px; 
            border-color: transparent transparent transparent #fff; 
            margin-left: 4px; 
        }
        
        .post-title { 
            padding: 14px 15px 8px 15px; 
            font-size: 15px; 
            font-weight: bold; 
            color: #fff; 
            cursor: pointer; 
            line-height: 1.4;
        }
        .post-meta { 
            padding: 0 15px 15px 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-size: 12px; 
            color: #aaa; 
            gap: 10px;
        }
        .action-btn { 
            background-color: #ff4757; 
            color: #fff !important; 
            padding: 10px 18px; 
            border-radius: 20px; 
            font-weight: bold; 
            border: none; 
            cursor: pointer; 
            display: inline-block; 
            text-decoration: none;
            font-size: 12px;
            user-select: none;
        }

        .back-btn { 
            align-self: flex-start; 
            background-color: #222; 
            color: #ff4757; 
            padding: 8px 14px; 
            border-radius: 6px; 
            border: 1px solid #333; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 12px; 
            text-decoration: none;
            display: inline-block;
        }
        
        .video-player-box { 
            position: relative; 
            width: 100%; 
            padding-bottom: 56.25%; 
            background-color: #000; 
            border-radius: 6px; 
            overflow: hidden; 
        }
        .video-player-box iframe { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            border: 0; 
        }

        .channel-profile-card { 
            background-color: #1a1a1a; 
            border: 1px solid #2a2a2a; 
            border-radius: 8px; 
            padding: 12px 15px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            cursor: pointer; 
        }
        .channel-info-left { 
            display: flex; 
            align-items: center;
